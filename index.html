            if (raw === null || raw === undefined) return '';

            const y = parsed.getFullYear(), m = parsed.getMonth() + 1, d = parsed.getDate();

        const TrackingTimeline = ({ issue }) => {

        const MeetingPage = ({ meeting, trackingData, attendanceData }) => {
            const meetingIssues = useMemo(() => {
                return trackingData.filter(item => item.date === meeting.id);

            const meetingAttendance = useMemo(() => {
                return attendanceData.filter(person => {
                    const raw = person['場次'] || '';
                    if (normalizeMeetingId(raw) === meeting.id) return true; // 智慧解析（含日期儲存格）
                    return meeting.dateFilter.some(df => raw.includes(df)); // 保留原字串包含比對作為後備
                });
            }, [attendanceData, meeting]);

            const stats = useMemo(() => {
                const residents = meetingAttendance.filter(p => {
                    const title = p['職稱'] || '';
                    const role = p['職級'] || '';
                    return role === '住院醫師' || RESIDENT_KEYWORDS.some(k => title.includes(k));
                });
                const residentDepts = [...new Set(residents.map(r => r['科別名'] || r['科別'] || '').filter(d => d))];
                const advisors = meetingAttendance.filter(p => p['職級'] === '指導長官').map(p => ({ name: p['姓名'], title: p['職稱'] }));
                const chairs = meetingAttendance.filter(p => p['職級'] === '主席').map(p => ({ name: p['姓名'], title: p['職稱'] }));
                const teachingSups = meetingAttendance.filter(p => p['職級'] === '教學主管').map(p => ({ name: p['姓名'], title: p['職稱'] }));
                const attendingSups = meetingAttendance.filter(p => p['職級'] === '列席主管').map(p => ({ name: p['姓名'], title: p['職稱'] }));
                const coordinators = meetingAttendance.filter(p => p['職級'] === '教學負責人').map(p => ({ name: p['姓名'], title: p['職稱'] }));

                return {
                    totalAttendees: meetingAttendance.length,
                    residentCount: residents.length,
                    totalIssues: meetingIssues.length,
                    residentDepts,
                    chairs,
                    advisors,
                    teachingSups,
                    attendingSups,
                    coordinators

            }, [meetingAttendance, meetingIssues]);

            return (
                <div className="animate-fade-in space-y-8">
                    <div className="bg-gradient-to-r from-[#6B859E] to-[#556b80] rounded-2xl p-6 text-white shadow-lg">

                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">

                                <div className="flex items-center gap-2 mb-1 opacity-90 text-sm"><Icons.Users size={16} /> 住院醫師出席數</div>
                                <span className="text-3xl font-bold">{stats.residentCount} <span className="text-base font-normal">人</span></span>
                            </div>
                            <div className="bg-white/10 backdrop-blur-sm px-4 py-3 rounded-xl border border-white/20">

                            </div>
                            <div className="bg-white/10 backdrop-blur-sm px-4 py-3 rounded-xl border border-white/20 col-span-2 md:col-span-2 lg:col-span-4">
                                <div className="flex items-center gap-2 mb-2 opacity-90 text-sm"><Icons.Stethoscope size={16} /> 住院醫師科別</div>
                                <div className="flex flex-wrap gap-2">
                                    {stats.residentDepts.length > 0 ? stats.residentDepts.map((d, i) => <span key={i} className="text-sm bg-white/20 px-2.5 py-1 rounded text-white whitespace-nowrap">{d}</span>) : <span className="text-sm opacity-60">無資料</span>}
                                </div>
                            </div>
                            <div className="bg-white/10 backdrop-blur-sm px-4 py-3 rounded-xl border border-white/20 col-span-2 md:col-span-4 lg:col-span-6">
                                <div className="flex items-center gap-2 mb-2 opacity-90 text-sm"><Icons.UserCheck size={16} /> 出席長官</div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-3">
                                    {stats.chairs.length > 0 && <div><span className="text-xs text-white/70 block mb-1">主席</span><div className="flex flex-wrap gap-1.5">{stats.chairs.map((p, i) => <span key={i} className="text-sm bg-[#D6A28D]/90 px-2 py-0.5 rounded text-white">{p.name} {p.title}</span>)}</div></div>}
                                    {stats.advisors.length > 0 && <div><span className="text-xs text-white/70 block mb-1">指導長官</span><div className="flex flex-wrap gap-1.5">{stats.advisors.map((p, i) => <span key={i} className="text-sm bg-[#D6A28D]/90 px-2 py-0.5 rounded text-white">{p.name} {p.title}</span>)}</div></div>}
                                    {stats.teachingSups.length > 0 && <div><span className="text-xs text-white/70 block mb-1">教學主管</span><div className="flex flex-wrap gap-1.5">{stats.teachingSups.map((p, i) => <span key={i} className="text-sm bg-[#D6A28D]/90 px-2 py-0.5 rounded text-white">{p.name} {p.title}</span>)}</div></div>}
                                    {stats.attendingSups.length > 0 && <div><span className="text-xs text-white/70 block mb-1">列席主管</span><div className="flex flex-wrap gap-1.5">{stats.attendingSups.map((p, i) => <span key={i} className="text-sm bg-[#D6A28D]/90 px-2 py-0.5 rounded text-white">{p.name} {p.title}</span>)}</div></div>}
                                    {stats.coordinators.length > 0 && <div><span className="text-xs text-white/70 block mb-1">教學負責人</span><div className="flex flex-wrap gap-1.5">{stats.coordinators.map((p, i) => <span key={i} className="text-sm bg-[#D6A28D]/90 px-2 py-0.5 rounded text-white">{p.name} {p.title}</span>)}</div></div>}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-100">
                        <div className="p-8 border-b border-slate-100 sticky top-0 bg-white z-10 rounded-t-2xl">
                            <h3 className="font-bold text-2xl text-slate-700 flex items-center gap-3">
                                <Icons.FileText className="text-slate-400" size={28} /> 本場次決議成效追蹤
                            </h3>
                        </div>
                        <div className="p-8 grid grid-cols-1 md:grid-cols-2 gap-8">
                            {meetingIssues.length > 0 ? meetingIssues.map((issue, idx) => (
                                <div key={idx} className="border border-slate-200 rounded-xl p-8 bg-slate-50/50 flex flex-col h-full hover:border-slate-300 transition-all">

                                        <div className="flex items-center gap-3">
                                            <span className="text-base font-bold text-slate-500 bg-white border px-3 py-1 rounded">#{issue.id}</span>
                                            <span className="text-lg font-semibold text-slate-600">{issue.category}</span>

                                        <StatusBadge status={issue.status} />
                                    </div>

                                        <div><span className="block text-sm text-slate-400 mb-1.5">提案者</span>{issue.proposer}</div>
                                        <div><span className="block text-sm text-slate-400 mb-1.5">負責窗口 (PIC)</span>{issue.pic || '-'}</div>

                                        <div className="mt-1 text-slate-400 flex-shrink-0"><Icons.ChevronRight size={20} /></div>
                                        <div>
                                            <span className="block text-base font-bold text-slate-500 mb-1">
                                                {issue.progress ? '最新進度' : '會議決議'}
                                            </span>
                                            <p className="text-lg text-slate-700 leading-relaxed">{issue.progress || issue.resolution || '尚無資料'}</p>
                                        </div>
                                    </div>

                            )) : (
                                <div className="col-span-2 text-center py-12 text-slate-400">
                                    <Icons.FileText size={48} className="mx-auto mb-4 opacity-50" />
                                    <p className="text-xl">此場次尚無議題資料</p>
                                    {trackingData.length > 0 && (
                                        <details className="mt-6 text-left max-w-xl mx-auto text-xs">
                                            <summary className="cursor-pointer text-slate-400 hover:text-slate-600">診斷資訊（若議題應存在卻未顯示，請點此展開檢查場次對應）</summary>
                                            <div className="mt-3 bg-slate-50 border border-slate-200 rounded-lg p-4 font-mono space-y-1 max-h-64 overflow-auto">
                                                <div className="text-slate-500 mb-2">本頁場次 ID：<span className="text-slate-800">{meeting.id}</span></div>
                                                {trackingData.map((it, i) => (
                                                    <div key={i} className={it.date === meeting.id ? 'text-green-600' : 'text-slate-400'}>
                                                        序號 {it.id || '?'}：原始場次「{it.rawDate}」→ 解析「{it.date}」{it.date === meeting.id ? ' ✓ 符合本頁' : ''}
                                                    </div>
                                                ))}
                                            </div>
                                        </details>
                                    )}
                                </div>
                            )}
                        </div>
                    </div>

                    {meeting.photos && meeting.photos.length > 0 && (
                        <div className="bg-white rounded-2xl shadow-sm border border-slate-100">
                            <div className="p-8 border-b border-slate-100">
                                <h3 className="font-bold text-2xl text-slate-700 flex items-center gap-3">
                                    <Icons.Camera className="text-slate-400" size={28} /> 會議紀錄照片
                                </h3>
                            </div>
                            <div className="p-8">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {meeting.photos.map((photo, idx) => (
                                        <div key={idx} className="photo-cell aspect-[4/3] rounded-xl overflow-hidden shadow-md hover:shadow-lg transition-shadow cursor-pointer group">
                                            <img
                                                src={PHOTO_BASE + photo}
                                                alt={`會議照片 ${idx + 1}`}
                                                loading="lazy"
                                                className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                                                onClick={() => window.open(PHOTO_BASE + photo, '_blank')}
                                                onError={(e) => { const cell = e.target.closest('.photo-cell'); if (cell) cell.style.display = 'none'; }}
                                            />
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('overview');
            const [loading, setLoading] = useState(true);
            const [isRefreshing, setIsRefreshing] = useState(false);
            const [error, setError] = useState(null);
            const [data, setData] = useState({ tracking: [], attendance: [], meta: {} });
            const [lastUpdated, setLastUpdated] = useState(null);

            const fetchData = useCallback(async (isAutoRefresh = false) => {
                try {
                    if (!isAutoRefresh) setLoading(true);
                    else setIsRefreshing(true);

                    const response = await fetch(`${API_URL}?t=${new Date().getTime()}`);
                    if (!response.ok) throw new Error('網路回應異常');
                    const result = await response.json();
                    
                    setData(result);
                    setLastUpdated(new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' }));
                    setError(null);
                } catch (err) {
                    console.error("Fetch Error:", err);
                    if (!isAutoRefresh) setError(err.message);
                } finally {
                    setLoading(false);
                    setIsRefreshing(false);
                }
            }, []);

            useEffect(() => {
                fetchData();
                const timer = setInterval(() => {
                    fetchData(true);
                }, REFRESH_INTERVAL);
                return () => clearInterval(timer);
            }, [fetchData]);

            const trackingData = useMemo(() => {
                const mapped = data.tracking.map(item => {
                    // MODIFIED: 提取結案日期欄位值，用來作為最高優先級判斷
                    const closeDateStr = item['結案日期'] || item['關閉日期'] || item['結案時間'] || '';
                    
                    // MODIFIED: 提取狀態文字欄位
                    let rawStatus = (item['現狀'] || item['狀態'] || item['追蹤現狀'] || item['處理狀態'] || item['結案情形'] || '').toString();
                    let status = '待決議';
                    
                    // MODIFIED: 優先權 1 - 只要有填寫「結案日期」，狀態強制為已結案
                    if (closeDateStr && closeDateStr.trim() !== '') {
                        status = '已結案';
                    } 
                    // MODIFIED: 優先權 2 - 文字判斷
                    else if (rawStatus.includes('已結案') || rawStatus.includes('結案') || rawStatus.includes('完成') || rawStatus.includes('Close')) {
                        status = '已結案';
                    } else if (rawStatus.includes('進行中') || rawStatus.includes('開發中') || rawStatus.includes('評估') || rawStatus.includes('規劃') || rawStatus.includes('Ongoing')) {
                        status = '進行中';
                    } else if (rawStatus.includes('待決議') || rawStatus.includes('待') || rawStatus === '') {
                        status = '待決議';
                    }

                    const proposer = item['提案者'] || '';
                    const dept = proposer.includes('/') ? proposer.split('/')[0] : proposer;

                    const meetingDate = normalizeMeetingId(item['場次'] || '');

                    return {
                        date: meetingDate,
                        rawDate: item['場次'] || '',
                        id: item['序號'] || '',
                        category: item['議題類別'] || item['序號類別'] || '未分類',
                        goal: item['具體目標'] || '',
                        proposer: proposer,
                        dept: dept,
                        pic: item['負責單位'] || item['負責窗口'] || '',
                        milestone: item['預計里程碑'] || '',
                        status: status,
                        progress: item['第一次追蹤摘要'] || item['追蹤報告'] || '',
                        resolution: item['會議決議'] || item['會議/決議'] || '',
                        submitDate: formatDate(item['提案日期'] || item['提獎日期']),
                        deadline: formatDate(item['訂定完成期限']),
                        progressPercent: item['進度百分比'] || '',
                        track1Date: formatDate(item['第一次追蹤日期']),
                        track1Summary: item['第一次追蹤摘要'] || '',
                        track2Date: formatDate(item['第二次追蹤/延期日期'] || item['第二次追蹤日期'] || item['第二次追蹤/延期/關閉日期']),
                        track2Summary: item['第二次追蹤摘要'] || '',
                        track3Date: formatDate(item['第三次追蹤/延期日期'] || item['第三次追蹤日期']),
                        track3Summary: item['第三次追蹤摘要'] || '',
                        updateDate: formatDate(item['第一次追蹤日期'] || item['追蹤日期']),
                        closeDate: formatDate(closeDateStr)
                    };
                });

                const getStatusWeight = (status) => {
                    if (status.includes('待決議')) return 1;
                    if (status.includes('進行中')) return 2;
                    if (status.includes('已結案')) return 3;
                    return 4;
                };

                return mapped.sort((a, b) => getStatusWeight(a.status) - getStatusWeight(b.status));
            }, [data.tracking]);

            // 合併雲端 Sheet 與本地補登的出席名單（同場次+同姓名 已存在於 Sheet 時，本地資料自動略過）
            const mergedAttendance = useMemo(() => {
                const api = data.attendance || [];
                const extras = LOCAL_ATTENDANCE.filter(local => {
                    const localId = normalizeMeetingId(local['場次']);
                    return !api.some(p => (p['姓名'] || '').trim() === local['姓名'] && normalizeMeetingId(p['場次'] || '') === localId);
                });
                return [...api, ...extras];
            }, [data.attendance]);

            const overviewStats = useMemo(() => {
                const total = trackingData.length;
                const completed = trackingData.filter(i => i.status.includes('已結案')).length;
                const inProgress = trackingData.filter(i => i.status.includes('進行中')).length;
                const pending = trackingData.filter(i => i.status.includes('待決議')).length;

                const pieData = [
                    { name: '已結案', value: completed, color: COLORS.secondary },
                    { name: '進行中', value: inProgress, color: COLORS.accent },
                    { name: '待決議', value: pending, color: COLORS.warning },
                ].filter(d => d.value > 0);

                const categoryCount = trackingData.reduce((acc, curr) => {
                    const cat = curr.category || '未分類';
                    acc[cat] = (acc[cat] || 0) + 1;
                    return acc;
                }, {});

                const barData = Object.keys(categoryCount).map(key => ({
                    name: key, count: categoryCount[key]
                }));

                return { total, completed, inProgress, pending, pieData, barData };
            }, [trackingData]);

            if (loading) return <div className="min-h-screen flex flex-col items-center justify-center space-y-4 bg-[#F5F5F3]"><div className="animate-spin text-slate-400"><Icons.Loader2 size={48} /></div><p className="text-xl text-slate-500 font-medium">即時資料同步中，請稍候...</p></div>;
            if (error) return <div className="min-h-screen flex flex-col items-center justify-center space-y-4 bg-[#F5F5F3]"><div className="text-red-500"><Icons.AlertCircle size={48} /></div><h3 className="text-2xl font-bold text-slate-700">資料載入失敗</h3><p className="text-lg text-slate-500">{error}</p><button onClick={() => fetchData()} className="px-6 py-3 bg-slate-200 rounded-lg text-slate-600 hover:bg-slate-300 text-lg">重新嘗試</button></div>;

            return (
                <div className="min-h-screen font-sans bg-[#F5F5F3] flex flex-col">
                    <nav className="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-20">
                        {/* 第一列：標題 + 同步狀態 + 重新整理（響應式：窄螢幕自動換行、標題不擠壓變直排） */}
                        <div className="max-w-[95%] mx-auto pt-3 md:pt-4 flex items-center justify-between gap-3">
                            <div className="flex items-center gap-2.5 md:gap-3 min-w-0">
                                <div className="p-2 md:p-2.5 rounded-lg text-white flex-shrink-0" style={{ backgroundColor: COLORS.primary }}><Icons.LayoutDashboard size={22} /></div>
                                <h1 className="text-lg md:text-2xl font-bold tracking-tight whitespace-nowrap truncate" style={{ color: COLORS.text }}>
                                    住院醫師座談會
                                    <span className="hidden sm:inline text-slate-400 font-normal text-sm md:text-base ml-2 md:ml-3">成效追蹤儀表板</span>
                                </h1>
                            </div>
                            <div className="flex items-center gap-2 md:gap-3 flex-shrink-0">
                                <div className="hidden sm:flex items-center gap-1.5 text-xs font-medium text-slate-400 whitespace-nowrap">
                                    {isRefreshing ? <Icons.RefreshCw size={12} className="animate-spin text-blue-400" /> : <div className="w-2 h-2 rounded-full bg-green-500"></div>}
                                    {isRefreshing ? "同步中..." : `已同步 ${lastUpdated}`}
                                </div>
                                <button
                                    onClick={() => fetchData(true)}
                                    disabled={isRefreshing}
                                    className={`p-2 rounded-lg border border-slate-200 hover:bg-slate-50 transition-all ${isRefreshing ? 'bg-blue-50 cursor-wait' : 'bg-white'}`}
                                    title="立刻強制重新整理 Sheet"
                                >
                                    <Icons.RefreshCw size={16} className={isRefreshing ? "animate-spin text-blue-500" : "text-slate-500"} />
                                </button>
                            </div>
                        </div>
                        {/* 第二列：分頁列（簡約底線式，窄螢幕可橫向滑動） */}
                        <div className="max-w-[95%] mx-auto mt-2 md:mt-3 overflow-x-auto custom-scrollbar">
                            <div className="flex gap-4 md:gap-8 min-w-max">
                                <button onClick={() => setActiveTab('overview')} className={`pb-2.5 pt-1 text-sm md:text-base whitespace-nowrap border-b-2 transition-colors ${activeTab === 'overview' ? 'border-[#6B859E] text-slate-800 font-bold' : 'border-transparent text-slate-400 font-medium hover:text-slate-600'}`}>總覽</button>
                                {MEETINGS.map(m => (
                                    <button key={m.id} onClick={() => setActiveTab(m.id)} className={`pb-2.5 pt-1 text-sm md:text-base whitespace-nowrap border-b-2 transition-colors ${activeTab === m.id ? 'border-[#6B859E] text-slate-800 font-bold' : 'border-transparent text-slate-400 font-medium hover:text-slate-600'}`}>{m.date}</button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    <main className="p-4 md:p-10 max-w-[95%] mx-auto space-y-6 md:space-y-10 flex-grow w-full">
                        {activeTab === 'overview' && (
                            <div className="animate-fade-in space-y-8">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                    <StatCard title="總提案數" value={overviewStats.total} icon={Icons.FileText} color={COLORS.primary} subtext="累計至目前所有場次" />
                                    <StatCard title="已結案" value={overviewStats.completed} icon={Icons.CheckCircle2} color={COLORS.secondary} subtext="達成率追蹤" />
                                    <StatCard title="進行中" value={overviewStats.inProgress} icon={Icons.Clock} color={COLORS.accent} subtext="按進度執行中" />
                                    <StatCard title="待決議" value={overviewStats.pending} icon={Icons.HelpCircle} color={COLORS.warning} subtext="需跨部門協調" />
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                        <h3 className="font-bold text-lg mb-4 flex items-center gap-2 text-slate-700"><Icons.Filter size={20} /> 案件狀態分佈</h3>
                                        <div className="h-48 w-full">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <PieChart>
                                                    <Pie
                                                        data={overviewStats.pieData}
                                                        innerRadius={50}
                                                        outerRadius={70}
                                                        paddingAngle={5}
                                                        dataKey="value"
                                                        label={({ name, value }) => `${name}: ${value}`}
                                                        labelLine={{ strokeWidth: 1 }}
                                                        style={{ fontSize: '14px', fontWeight: '500' }}
                                                    >
                                                        {overviewStats.pieData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} />)}
                                                    </Pie>
                                                    <RechartsTooltip />
                                                    <Legend verticalAlign="bottom" height={36} wrapperStyle={{ fontSize: '16px' }} />
                                                </PieChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                        <h3 className="font-bold text-lg mb-4 flex items-center gap-2 text-slate-700"><Icons.LayoutDashboard size={20} /> 議題類別分析</h3>
                                        <div className="h-48 w-full">
                                            <ResponsiveContainer width="100%" height="100%">
                                                <BarChart data={overviewStats.barData} layout="vertical" margin={{ top: 5, right: 40, left: 40, bottom: 5 }}>
                                                    <CartesianGrid strokeDasharray="3 3" horizontal={false} />
                                                    <XAxis type="number" hide />
                                                    <YAxis dataKey="name" type="category" width={100} tick={{ fontSize: 14 }} />
                                                    <RechartsTooltip cursor={{ fill: 'transparent' }} />
                                                    <Bar dataKey="count" fill={COLORS.primary} radius={[0, 6, 6, 0]} barSize={24}>
                                                        <LabelList dataKey="count" position="right" fill="#666" fontSize={14} fontWeight="bold" />
                                                    </Bar>
                                                </BarChart>
                                            </ResponsiveContainer>
                                        </div>
                                    </div>
                                </div>
                                <div className="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
                                    <div className="p-8 border-b border-slate-100 flex justify-between items-center bg-white sticky top-0">
                                        <h3 className="font-bold text-2xl text-slate-700">全院議題追蹤清單</h3>
                                        <div className={`flex items-center gap-2 text-sm px-4 py-2 rounded transition-colors ${isRefreshing ? 'text-blue-500 bg-blue-50' : 'text-slate-400 bg-slate-50'}`}>
                                            {isRefreshing ? <Icons.RefreshCw size={14} className="animate-spin" /> : <div className="w-1.5 h-1.5 rounded-full bg-green-500 sync-pulse"></div>}
                                            {isRefreshing ? "正在讀取 Sheet 最新內容..." : "已顯示 Sheet 最新進度"}
                                        </div>
                                    </div>
                                    {/* 新增/修改：加入 min-h-[400px] 確保當表格列數較少時，向上展開的 Tooltip 不會被此容器切斷 */}
                                    <div className="overflow-x-auto min-h-[400px]">
                                        <table className="w-full text-left border-collapse">
                                            <thead className="bg-slate-50 text-slate-600 text-sm tracking-wider sticky top-0 z-10">
                                                <tr>
                                                    <th className="p-3 font-bold w-12 text-center" style={{ writingMode: 'vertical-rl', textOrientation: 'mixed' }}>場次</th>
                                                    <th className="p-3 font-bold w-12 text-center" style={{ writingMode: 'vertical-rl', textOrientation: 'mixed' }}>狀態</th>
                                                    <th className="p-3 font-bold w-20 hidden lg:table-cell" style={{ writingMode: 'vertical-rl', textOrientation: 'mixed' }}>提出科別</th>
                                                    <th className="p-4 font-bold w-24 hidden lg:table-cell">議題類別</th>
                                                    <th className="p-4 font-bold">具體目標</th>
                                                    <th className="p-4 font-bold hidden md:table-cell" style={{ minWidth: '280px' }}>追蹤時間軸</th>
                                                    <th className="p-4 font-bold w-24 hidden lg:table-cell">負責單位</th>
                                                    <th className="p-4 font-bold hidden xl:table-cell" style={{ minWidth: '300px' }}>追蹤報告/會議決議</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100 text-base">
                                                {trackingData.map((item, index) => {
                                                    const timePoints = [
                                                        { label: '提案', date: item.submitDate, color: '#3b82f6', summary: '' },
                                                        { label: '追蹤1', date: item.track1Date, color: '#f59e0b', summary: item.track1Summary || '' },
                                                        { label: '追蹤2', date: item.track2Date, color: '#8b5cf6', summary: item.track2Summary || '' },
                                                        { label: '追蹤3', date: item.track3Date, color: '#ec4899', summary: item.track3Summary || '' },
                                                        { label: '結案', date: item.closeDate, color: '#22c55e', summary: '' },
                                                    ].filter(p => p.date && p.date !== '');

                                                    return (
                                                        <tr key={index} className="hover:bg-slate-50/50 transition-colors">
                                                            <td className="p-3 align-top text-slate-600 font-medium text-sm text-center" style={{ writingMode: 'vertical-rl', textOrientation: 'mixed' }}>{item.date}</td>
                                                            <td className="p-3 align-top text-center"><StatusBadge status={item.status} /></td>
                                                            <td className="p-3 align-top text-slate-600 hidden lg:table-cell text-sm" style={{ writingMode: 'vertical-rl', textOrientation: 'mixed' }}>{item.dept}</td>
                                                            <td className="p-4 align-top text-slate-500 hidden lg:table-cell">{item.category}</td>
                                                            <td className="p-4 align-top">
                                                                <div className="font-bold text-slate-800 leading-snug">{item.goal}</div>
                                                                <div className="lg:hidden mt-2 text-sm text-slate-400">
                                                                    <span>{item.dept}</span> · <span>{item.category}</span>
                                                                </div>
                                                            </td>
                                                            <td className="p-4 align-top hidden md:table-cell" style={{ minWidth: '280px' }}>
                                                                {timePoints.length > 0 ? (
                                                                    <div className="flex items-start gap-0">
                                                                        {timePoints.map((point, idx) => (
                                                                            <div key={idx} className="flex items-center group relative">
                                                                                <div className="flex flex-col items-center min-w-[50px] cursor-pointer">
                                                                                    <div
                                                                                        className="w-3 h-3 rounded-full flex-shrink-0 shadow-sm hover:scale-150 transition-transform"
                                                                                        style={{ backgroundColor: point.color }}
                                                                                        title={point.summary ? `${point.label}\n${point.date}\n${point.summary}` : `${point.label}: ${point.date}`}
                                                                                    />
                                                                                    <span className="text-[10px] text-slate-500 mt-1 font-medium">{point.label}</span>
                                                                                    <span className="text-[10px] text-slate-400">{point.date}</span>
                                                                                </div>
                                                                                {point.summary && (
                                                                                    /* 新增/修改：大幅優化 Tooltip 的寬度 (min-w-[240px] max-w-[320px])、Padding (p-4) 與文字自動換行 (break-words leading-relaxed)，解決文字底部被切斷問題 */
                                                                                    <div className="absolute bottom-full left-1/2 -translate-x-1/2 mb-3 hidden group-hover:block z-[100] pointer-events-none w-max min-w-[240px] max-w-[320px]">
                                                                                        <div className="bg-slate-800 text-white text-[13px] rounded-xl p-4 shadow-2xl whitespace-pre-wrap break-words leading-relaxed border border-slate-700/80">
                                                                                            <div className="font-bold mb-2 flex items-center gap-2" style={{ color: point.color || '#fbbf24' }}>
                                                                                                <span className="w-2.5 h-2.5 rounded-full shadow-sm" style={{ backgroundColor: point.color || '#fbbf24' }}></span>
                                                                                                {point.label}
                                                                                            </div>
                                                                                            <div className="text-slate-300 mb-2.5 font-mono text-xs bg-slate-900/60 inline-block px-2.5 py-1 rounded-md border border-slate-700/50">
                                                                                                {point.date}
                                                                                            </div>
                                                                                            <div className="border-t border-slate-600/80 pt-3 mt-1 text-slate-100 text-left">
                                                                                                {point.summary}
                                                                                            </div>
                                                                                        </div>
                                                                                        {/* 加大倒三角形使其與新尺寸更搭配 */}
                                                                                        <div className="absolute top-full left-1/2 -translate-x-1/2 border-[6px] border-transparent border-t-slate-800"></div>
                                                                                    </div>
                                                                                )}
                                                                                {idx < timePoints.length - 1 && (
                                                                                    <div className="w-4 h-0.5 bg-slate-300 -mt-4"></div>
                                                                                )}
                                                                            </div>
                                                                        ))}
                                                                    </div>
                                                                ) : (
                                                                    <span className="text-sm text-slate-400">尚無追蹤紀錄</span>
                                                                )}
                                                            </td>
                                                            <td className="p-4 align-top text-slate-600 text-sm hidden lg:table-cell">
                                                                {item.pic && <span className="font-medium">{item.pic}</span>}
                                                            </td>
                                                            <td className="p-4 align-top text-slate-600 text-sm hidden xl:table-cell" style={{ minWidth: '300px', maxWidth: '400px' }}>
                                                                {item.progress && <div className="mb-2 whitespace-pre-wrap"><span className="font-semibold text-slate-700">追蹤:</span> {item.progress}</div>}
                                                                {item.resolution && <div className="text-slate-500 whitespace-pre-wrap"><span className="font-semibold">決議:</span> {item.resolution}</div>}
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {MEETINGS.map(m => (
                            activeTab === m.id && (
                                <MeetingPage
                                    key={m.id}
                                    meeting={m}
                                    trackingData={trackingData}
                                    attendanceData={mergedAttendance}
                                />
                            )
                        ))}
                    </main>

                    <footer className="bg-white border-t border-slate-200 py-6">
                        <div className="max-w-[95%] mx-auto flex justify-between items-center text-slate-400 text-base font-medium px-4">
                            <div>教學部 住院醫師組</div>
                            <div className="text-sm text-slate-300 flex items-center gap-2">
                                <div className="w-1.5 h-1.5 rounded-full bg-blue-400"></div>
                                每 60 秒與雲端同步一次
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
