<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住院醫師座談會 - 前測問卷</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-[#F0EBE5]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // =====================================================================
        //  設定區
        // =====================================================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzV3opsPd2bsqNDP1eiGHR8egTkLSG-1CjmG64aSOufBzPFdyL2dn-6Mu0nGTaFOpqX/exec";
        const VERSION = "v2-1151020";

        // 科部選單（可自行增刪；選「其他」可手填）
        const DEPARTMENTS = ['內科部', '神經內科', '外科部', '神經外科', '骨科部', '泌尿外科', '整形外科', '婦產部', '兒科部',
            '急診醫學部', '家庭醫學部', '麻醉部', '放射診斷科', '放射腫瘤部', '解剖病理部', '復健部', '精神醫學部', '耳鼻喉部', '眼科部'];
        const RANKS = ['R1', 'R2', 'R3', 'R4', 'R5', 'R6以上', 'CR', '研究員'];
        const PARTICIPATION = ['第一次參加', '參加過，未提案', '參加過，曾提案或發言'];

        // ---- 題目 ----
        // key = Google Sheet 欄位名稱。Q1～Q3、Q4、Q5、Q7 文字與 114/12 起的舊版完全相同，可接續做逐年比較。
        const SECTIONS = [
            {
                title: '一、臨床工作與系統現況', desc: '請評估以下敘述與您現況的符合程度', color: 'text-[#6B705C]',
                items: [
                    ['Q1_系統流程影響', '我在日常工作中，經常因資訊系統或流程不順，影響臨床學習或教學效率。'],
                    ['Q2_系統設計需求', '目前的臨床系統設計（如病歷、報告、影像系統），未能充分反映住院醫師的實際使用需求。'],
                    ['Q3_非教學作業佔比', '我認為目前有相當比例的工作時間，被耗費在「非教學本質」的重複或低效率作業上。'],
                ],
            },
            {
                title: '二、意見表達與追蹤', desc: '本段題目與後測相同，用來比較座談會前後的變化', color: 'text-[#CB997E]',
                items: [
                    ['Q4_表達機會', '我有機會向院方或教學主管表達實際影響學習的問題。'],
                    ['Q5_心理安全感', '即使提出不同意見，我也不擔心會對自己造成負面影響。'],
                    ['C3_課責信任', '我相信在座談會提出的問題，會被持續追蹤並得到回應。'],
                    ['Q7_制度參與認同', '我認為住院醫師參與院內制度或流程改善，對教學品質是有幫助的。'],
                    ['C5_追蹤可見性', '我知道可以到哪裡查詢座談會提案的處理進度。'],
                ],
            },
        ];
        const LIKERT_KEYS = SECTIONS.flatMap(s => s.items.map(i => i[0]));

        // =====================================================================
        //  場次與匿名配對碼
        // =====================================================================
        // 場次：網址可帶 ?m=20261020；未帶則用填答當天（台灣時間）
        const meetingId = (() => {
            const m = new URLSearchParams(location.search).get('m');
            if (m && /^\d{8}$/.test(m)) return `${m.slice(0, 4)}/${m.slice(4, 6)}/${m.slice(6, 8)}`;
            const d = new Date(Date.now() + 8 * 3600e3);
            return `${d.getUTCFullYear()}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${String(d.getUTCDate()).padStart(2, '0')}`;
        })();
        const rocYear = +meetingId.slice(0, 4) - 1911;

        const store = {
            get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
        };
        // 匿名配對碼：同一支手機在前測產生、後測自動帶入；不含任何個人資料
        const getPairCode = () => {
            let c = store.get('rmeeting.pairCode');
            if (!c) {
                const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
                const r = new Uint32Array(6);
                (window.crypto || window.msCrypto).getRandomValues(r);
                c = Array.from(r, n => A[n % A.length]).join('');
                store.set('rmeeting.pairCode', c);
            }
            return c;
        };

        // =====================================================================
        //  元件
        // =====================================================================
        const Icon = ({ d, size = 24, className = '' }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: d }} />
        );
        const ICON = {
            check: '<polyline points="20 6 9 17 4 12"/>',
            send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
            user: '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
            clip: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>',
            msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
            loader: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
        };

        const SectionCard = ({ icon, title, description, children }) => (
            <div className="bg-white/90 rounded-3xl p-6 md:p-8 shadow-sm border border-white/50">
                <div className="flex items-start gap-4 mb-6">
                    <div className="p-3 bg-[#F0EBE5] rounded-2xl shrink-0">{icon}</div>
                    <div>
                        <h3 className="text-xl font-bold text-[#6B705C] tracking-wide">{title}</h3>
                        {description && <p className="text-sm text-[#A5A58D] mt-1 font-medium">{description}</p>}
                    </div>
                </div>
                <div className="space-y-6">{children}</div>
            </div>
        );

        const Chip = ({ active, onClick, children }) => (
            <button type="button" onClick={onClick}
                className={`px-3.5 py-2 rounded-lg text-sm font-medium transition-all ${active ? 'bg-[#CB997E] text-white shadow-md' : 'bg-[#F7F5F3] text-gray-600 hover:bg-[#EDE0D4]'}`}>
                {children}
            </button>
        );

        const LikertQuestion = ({ no, id, text, value, onChange, missing }) => (
            <div id={'q-' + id} className={`pb-5 border-b border-[#F0EBE5] last:border-0 last:pb-0 ${missing ? 'bg-red-50/60 -mx-3 px-3 pt-3 rounded-xl' : ''}`}>
                <p className="text-[#4A4A4A] font-medium mb-4 leading-relaxed text-[15px]"><span className="text-[#CB997E] font-bold mr-1">{no}.</span>{text}</p>
                <div className="flex items-center justify-center sm:justify-between gap-2">
                    <span className="hidden sm:block text-xs font-bold text-[#A5A58D] w-12 text-center leading-tight">非常<br />不同意</span>
                    <div className="flex gap-2 sm:gap-3">
                        {[1, 2, 3, 4, 5].map(s => (
                            <button key={s} type="button" onClick={() => onChange(id, s)} aria-label={`${s} 分`}
                                className={`w-10 h-10 md:w-11 md:h-11 rounded-full flex items-center justify-center text-sm font-bold transition-all border ${value === s ? 'bg-[#CB997E] border-[#CB997E] text-white shadow-lg scale-110' : 'bg-[#F7F5F3] border-transparent text-[#6B705C] hover:bg-[#E6E6E6]'}`}>
                                {s}
                            </button>
                        ))}
                    </div>
                    <span className="hidden sm:block text-xs font-bold text-[#A5A58D] w-12 text-center leading-tight">非常<br />同意</span>
                </div>
                <div className="flex justify-between sm:hidden text-[11px] font-bold text-[#A5A58D] mt-2 px-1"><span>1 非常不同意</span><span>5 非常同意</span></div>
            </div>
        );

        // =====================================================================
        //  主程式
        // =====================================================================
        const App = () => {
            const [submitted, setSubmitted] = useState(false);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [showMissing, setShowMissing] = useState(false);
            const [dept, setDept] = useState('');
            const [deptOther, setDeptOther] = useState('');
            const [rank, setRank] = useState('');
            const [rankOther, setRankOther] = useState('');
            const [participation, setParticipation] = useState('');
            const [scores, setScores] = useState({});

            const finalDept = dept === '其他' ? deptOther.trim() : dept;
            const finalRank = rank === '其他' ? rankOther.trim() : rank;
            const missingKeys = LIKERT_KEYS.filter(k => !scores[k]);

            const toast = (msg) => {
                const t = document.createElement('div');
                t.className = 'fixed top-4 left-1/2 -translate-x-1/2 bg-[#6B705C] text-white px-6 py-3 rounded-full shadow-lg z-50 font-medium';
                t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
            };

            const handleSubmit = async () => {
                if (!finalDept || !finalRank || !participation) {
                    toast('請先完成基本資料'); window.scrollTo({ top: 0, behavior: 'smooth' }); return;
                }
                if (missingKeys.length) {
                    setShowMissing(true);
                    toast(`還有 ${missingKeys.length} 題尚未填寫`);
                    document.getElementById('q-' + missingKeys[0])?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    return;
                }
                setIsSubmitting(true);
                const pairCode = getPairCode();
                store.set('rmeeting.profile', JSON.stringify({ dept: finalDept, rank: finalRank, meetingId }));
                // 送出的欄位名稱 = Google Sheet 欄位名稱
                const payload = {
                    '場次': meetingId, '配對碼': pairCode, '科部': finalDept, '職級': finalRank,
                    '參與經驗': participation, ...scores, '版本': VERSION,
                };
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload),
                    });
                    setSubmitted(true); window.scrollTo(0, 0);
                } catch (err) {
                    console.error(err); toast('傳送失敗，請檢查網路連線');
                } finally { setIsSubmitting(false); }
            };

            if (submitted) {
                return (
                    <div className="min-h-screen bg-[#F0EBE5] flex items-center justify-center p-6">
                        <div className="max-w-md w-full bg-white rounded-3xl shadow-xl p-10 text-center border border-[#E6E6E6]">
                            <div className="mx-auto w-20 h-20 bg-[#DDBEA9] rounded-full flex items-center justify-center mb-6">
                                <Icon d={ICON.check} size={40} className="text-white" />
                            </div>
                            <h2 className="text-2xl font-bold text-[#6B705C] mb-4">感謝您的填寫</h2>
                            <p className="text-gray-600 leading-relaxed">
                                會議結束或臨時需要離席時，<br />請再用<strong>同一支手機</strong>掃描「後測」QR code。
                            </p>
                            <p className="mt-6 text-xs text-gray-400">匿名配對碼：{store.get('rmeeting.pairCode') || '—'}（後測會自動帶入，不需記下）</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#F0EBE5] pb-20">
                    <header className="bg-[#6B705C] text-[#F0EBE5] pt-14 pb-28 px-6 rounded-b-[3rem] shadow-lg">
                        <div className="max-w-3xl mx-auto text-center">
                            <span className="inline-block px-4 py-1 mb-4 rounded-full border border-[#B7B7A4] text-sm tracking-wider bg-[#B7B7A4]/20">約 1 分鐘・不記名</span>
                            <h1 className="text-3xl md:text-4xl font-bold mb-3 tracking-tight">{rocYear} 年度住院醫師座談會</h1>
                            <h2 className="text-xl md:text-2xl font-medium text-[#DDBEA9] mb-5">前測問卷</h2>
                            <p className="text-[#F0EBE5]/90 text-sm md:text-base leading-relaxed max-w-2xl mx-auto">
                                了解住院醫師在臨床與教學現場的實際處境，並與會後問卷對照，評估座談會帶來的改變。
                            </p>
                            <p className="text-[#DDBEA9] text-xs mt-4">場次：{meetingId}</p>
                        </div>
                    </header>

                    <main className="max-w-3xl mx-auto px-4 -mt-16 relative z-20 space-y-6">
                        <SectionCard icon={<Icon d={ICON.user} className="text-[#CB997E]" />} title="基本資料">
                            <div className="space-y-2">
                                <label className="text-sm font-medium text-gray-600">科部</label>
                                <select value={dept} onChange={e => setDept(e.target.value)}
                                    className="w-full px-4 py-3 bg-[#F7F5F3] rounded-xl outline-none focus:ring-2 focus:ring-[#CB997E]/50 text-gray-700">
                                    <option value="">請選擇</option>
                                    {DEPARTMENTS.map(d => <option key={d}>{d}</option>)}
                                    <option>其他</option>
                                </select>
                                {dept === '其他' && <input value={deptOther} onChange={e => setDeptOther(e.target.value)} placeholder="請填寫科部名稱"
                                    className="w-full px-4 py-3 bg-[#F7F5F3] rounded-xl outline-none focus:ring-2 focus:ring-[#CB997E]/50" />}
                            </div>
                            <div className="space-y-2">
                                <label className="text-sm font-medium text-gray-600">職級</label>
                                <div className="flex flex-wrap gap-2">
                                    {RANKS.map(r => <Chip key={r} active={rank === r} onClick={() => setRank(r)}>{r}</Chip>)}
                                    <Chip active={rank === '其他'} onClick={() => setRank('其他')}>其他</Chip>
                                </div>
                                {rank === '其他' && <input value={rankOther} onChange={e => setRankOther(e.target.value)} placeholder="請填寫職級"
                                    className="w-full px-4 py-3 bg-[#F7F5F3] rounded-xl outline-none focus:ring-2 focus:ring-[#CB997E]/50" />}
                            </div>
                            <div className="space-y-2">
                                <label className="text-sm font-medium text-gray-600">過去是否參加過住院醫師座談會？</label>
                                <div className="flex flex-wrap gap-2">
                                    {PARTICIPATION.map(p => <Chip key={p} active={participation === p} onClick={() => setParticipation(p)}>{p}</Chip>)}
                                </div>
                            </div>
                        </SectionCard>

                        {SECTIONS.map((sec, si) => (
                            <SectionCard key={si} icon={<Icon d={si === 0 ? ICON.clip : ICON.msg} className={sec.color} />} title={sec.title} description={`${sec.desc}（1＝非常不同意，5＝非常同意）`}>
                                {sec.items.map(([id, text]) => (
                                    <LikertQuestion key={id} no={LIKERT_KEYS.indexOf(id) + 1} id={id} text={text} value={scores[id]}
                                        missing={showMissing && !scores[id]}
                                        onChange={(k, v) => setScores(p => ({ ...p, [k]: v }))} />
                                ))}
                            </SectionCard>
                        ))}

                        <div className="flex justify-center pt-4">
                            <button onClick={handleSubmit} disabled={isSubmitting}
                                className={`px-12 py-4 rounded-full text-white font-semibold text-lg shadow-lg transition-all ${isSubmitting ? 'bg-[#A5A58D] cursor-not-allowed' : 'bg-[#CB997E] hover:bg-[#B5836A]'}`}>
                                {isSubmitting
                                    ? <span className="flex items-center gap-2"><Icon d={ICON.loader} size={20} className="animate-spin" /> 處理中...</span>
                                    : <span className="flex items-center gap-2">提交問卷 <Icon d={ICON.send} size={20} /></span>}
                            </button>
                        </div>
                        <p className="text-center text-[#6B705C]/60 text-sm pb-12">問卷不記名，結果僅用於教學品質改善。教學部 住院醫師組</p>
                    </main>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
