<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>住院醫師座談會 - 後測問卷</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F2F0EB; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp .5s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // =====================================================================
        //  設定區
        // =====================================================================
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRs-m0XamgI3JNHlg8YkFynx0ZFdDy2YGSybpsERjK1tahXYLmk17rubAMkObnSNaB/exec';
        const VERSION = 'v2-1151020';

        const DEPARTMENTS = ['內科部', '神經內科', '外科部', '神經外科', '骨科部', '泌尿外科', '整形外科', '婦產部', '兒科部',
            '急診醫學部', '家庭醫學部', '麻醉部', '放射診斷科', '放射腫瘤部', '解剖病理部', '臨床病理科', '核子醫學科',
            '復健部', '精神醫學部', '耳鼻喉部', '眼科部', '皮膚科', '一般科（PGY）'];
        const RANKS = ['PGY1', 'PGY2', 'R1', 'R2', 'R3', 'R4', 'R5', 'R6以上', 'CR', '研究員'];
        const TIMING = ['會議結束後填寫', '臨床業務需提前離席'];

        // key = Google Sheet 欄位名稱。一、的 5 題文字沿用 114/12 起的後測原題，可接續比較。
        const SECTIONS = [
            {
                title: '一、本次座談會', desc: '請評估本次座談的聚焦程度與改善方案', icon: 'user', color: 'text-[#9AA598]',
                items: [
                    ['Q1.聚焦真實問題', '本次座談會確實聚焦於住院醫師在臨床與教學現場的真實問題。'],
                    ['Q2.重視學習處境', '我感受到院方或教學主管有理解並重視住院醫師的學習處境。'],
                    ['Q3.方案清楚易懂', '本次會議中提出的改善方案，內容清楚且容易理解。'],
                    ['Q7.願意持續參與', '若未來有相關教學或制度改善的討論或試行，我願意持續參與。'],
                    ['Q8.具實質價值', '我認為此類住院醫師座談，對教學品質改善具有實質價值，值得持續辦理。'],
                ],
            },
            {
                title: '二、意見表達與追蹤', desc: '本段題目與前測相同，用來比較座談會前後的變化', icon: 'shield', color: 'text-[#8FA3A8]',
                items: [
                    ['C1_表達機會', '我有機會向院方或教學主管表達實際影響學習的問題。'],
                    ['C2_心理安全感', '即使提出不同意見，我也不擔心會對自己造成負面影響。'],
                    ['C3_課責信任', '我相信在座談會提出的問題，會被持續追蹤並得到回應。'],
                    ['C4_制度參與認同', '我認為住院醫師參與院內制度或流程改善，對教學品質是有幫助的。'],
                    ['C5_追蹤可見性', '我知道可以到哪裡查詢座談會提案的處理進度。'],
                ],
            },
        ];
        const LIKERT_KEYS = SECTIONS.flatMap(s => s.items.map(i => i[0]));

        // =====================================================================
        //  場次、配對碼、前測帶入的基本資料
        // =====================================================================
        const meetingId = (() => {
            const m = new URLSearchParams(location.search).get('m');
            if (m && /^\d{8}$/.test(m)) return `${m.slice(0, 4)}/${m.slice(4, 6)}/${m.slice(6, 8)}`;
            const d = new Date(Date.now() + 8 * 3600e3);
            return `${d.getUTCFullYear()}/${String(d.getUTCMonth() + 1).padStart(2, '0')}/${String(d.getUTCDate()).padStart(2, '0')}`;
        })();
        const rocYear = +meetingId.slice(0, 4) - 1911;
        const store = {
            get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
            set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } },
        };
        const storedCode = store.get('rmeeting.pairCode');
        const storedProfile = (() => { try { return JSON.parse(store.get('rmeeting.profile') || 'null'); } catch (e) { return null; } })();
        const newCode = () => {
            const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
            const r = new Uint32Array(6); (window.crypto || window.msCrypto).getRandomValues(r);
            return Array.from(r, n => A[n % A.length]).join('');
        };

        // =====================================================================
        //  元件
        // =====================================================================
        const Icon = ({ d, className = 'w-6 h-6' }) => (
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: d }} />
        );
        const ICON = {
            user: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/>',
            shield: '<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
            msg: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
            id: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M15 8h2M15 12h2M7 16h10"/>',
            send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
            loader: '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
        };

        const SectionCard = ({ title, icon, color, description, children }) => (
            <div className="bg-white rounded-2xl p-6 md:p-8 shadow-sm border border-[#EAE8E3] animate-fade-in-up">
                <div className="flex items-center gap-3 mb-2">
                    <div className="p-2 bg-[#F2F0EB] rounded-lg"><Icon d={ICON[icon]} className={`w-6 h-6 ${color}`} /></div>
                    <h2 className="text-xl font-bold text-[#5E6160]">{title}</h2>
                </div>
                {description && <p className="text-[#888B8A] mb-6 ml-1 text-sm">{description}</p>}
                <div className="space-y-6">{children}</div>
            </div>
        );

        const Chip = ({ active, onClick, children }) => (
            <button type="button" onClick={onClick}
                className={`px-3.5 py-2 rounded-lg text-sm font-medium transition-all border ${active ? 'bg-[#7B8D8E] border-[#7B8D8E] text-white shadow' : 'bg-[#FAFAF9] border-[#DCD9D1] text-[#5E6160] hover:bg-[#EAE8E3]'}`}>
                {children}
            </button>
        );

        const LikertQuestion = ({ no, id, question, value, onChange, missing }) => (
            <div id={'q-' + id} className="space-y-3">
                <h3 className="text-base md:text-lg font-medium text-[#5E6160] leading-relaxed">{no}. {question}</h3>
                <div className={`flex items-center justify-center sm:justify-between gap-2 p-3 rounded-xl border ${missing ? 'bg-red-50 border-red-200' : 'bg-[#FAFAF9] border-[#F2F0EB]'}`}>
                    <span className="hidden sm:block text-xs text-[#9CA3AF] w-10 text-center leading-tight">非常<br />不同意</span>
                    <div className="flex gap-2 md:gap-5">
                        {[1, 2, 3, 4, 5].map(s => (
                            <button key={s} type="button" onClick={() => onChange(id, s)} aria-label={`${s} 分`}
                                className={`w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center text-lg font-medium transition-all ${value === s ? 'bg-[#7B8D8E] text-white shadow-md scale-110 ring-2 ring-[#7B8D8E] ring-offset-2' : 'bg-white text-[#888B8A] border border-[#DCD9D1] hover:bg-[#EAE8E3]'}`}>
                                {s}
                            </button>
                        ))}
                    </div>
                    <span className="hidden sm:block text-xs text-[#9CA3AF] w-10 text-center leading-tight">非常<br />同意</span>
                </div>
                <div className="flex justify-between sm:hidden text-[11px] text-[#9CA3AF] px-1 -mt-1"><span>1 非常不同意</span><span>5 非常同意</span></div>
            </div>
        );

        // =====================================================================
        //  主程式
        // =====================================================================
        const PostEventSurvey = () => {
            const initDept = storedProfile?.dept || '';
            const [dept, setDept] = useState(DEPARTMENTS.includes(initDept) || !initDept ? initDept : '其他');
            const [deptOther, setDeptOther] = useState(DEPARTMENTS.includes(initDept) ? '' : initDept);
            const initRank = storedProfile?.rank || '';
            const [rank, setRank] = useState(RANKS.includes(initRank) || !initRank ? initRank : '其他');
            const [rankOther, setRankOther] = useState(RANKS.includes(initRank) ? '' : initRank);
            const [timing, setTiming] = useState('');
            const [scores, setScores] = useState({});
            const [suggestion, setSuggestion] = useState('');
            const [manualCode, setManualCode] = useState('');
            const [status, setStatus] = useState('idle');
            const [errorMessage, setErrorMessage] = useState('');
            const [showMissing, setShowMissing] = useState(false);

            const finalDept = dept === '其他' ? deptOther.trim() : dept;
            const finalRank = rank === '其他' ? rankOther.trim() : rank;
            const missingKeys = LIKERT_KEYS.filter(k => !scores[k]);
            const fail = (msg, anchor) => {
                setStatus('error'); setErrorMessage(msg);
                if (anchor) document.getElementById(anchor)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                else window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!timing) return fail('請選擇填寫時機');
                if (!finalDept || !finalRank) return fail('請確認科部與職級');
                if (missingKeys.length) { setShowMissing(true); return fail(`還有 ${missingKeys.length} 題尚未填寫`, 'q-' + missingKeys[0]); }

                setStatus('submitting'); setErrorMessage('');
                let pairCode = storedCode, pairSource = '自動帶入';
                if (!pairCode) {
                    const m = manualCode.trim().toUpperCase();
                    if (/^[A-Z0-9]{6}$/.test(m)) { pairCode = m; pairSource = '手動輸入'; }
                    else { pairCode = newCode(); pairSource = '未配對'; }
                }
                const payload = {
                    '場次': meetingId, '配對碼': pairCode, '配對方式': pairSource,
                    '科部': finalDept, '職級': finalRank, '填答時機': timing,
                    ...scores, 'Q10.優先改善建議': suggestion.trim(), '版本': VERSION,
                };
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST', mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(payload),
                    });
                    setStatus('success'); window.scrollTo({ top: 0, behavior: 'smooth' });
                } catch (err) {
                    console.error(err); fail('送出失敗，請檢查網路連線或稍後再試。');
                }
            };

            if (status === 'success') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl p-8 md:p-12 shadow-xl text-center max-w-lg w-full border border-[#EAE8E3] animate-fade-in-up">
                            <div className="w-20 h-20 bg-[#F2F0EB] rounded-full flex items-center justify-center mx-auto mb-6"><Icon d={ICON.send} className="w-10 h-10 text-[#7B8D8E]" /></div>
                            <h2 className="text-2xl font-bold text-[#5E6160] mb-4">感謝您的回饋</h2>
                            <p className="text-[#888B8A] leading-relaxed">本次提案的處理進度會持續公開，可隨時查詢：</p>
                            <a href="https://b20434.github.io/RMeeting/" className="inline-block mt-3 text-[#7B8D8E] font-medium underline">b20434.github.io/RMeeting</a>
                            <p className="text-xs text-[#B0B3B2] mt-2">醫學教育委員會 → 住院醫師訓練 → 住院醫師座談會成效追蹤儀表板</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen py-8 md:py-12 px-4">
                    <div className="max-w-3xl mx-auto">
                        <div className="text-center mb-10 space-y-3">
                            <h1 className="text-2xl md:text-3xl font-bold text-[#5E6160] tracking-tight">
                                {rocYear} 年度住院醫師座談會
                                <span className="block text-3xl md:text-4xl text-[#7B8D8E] mt-2">後測問卷</span>
                            </h1>
                            <p className="text-[#888B8A] max-w-xl mx-auto">約 1 分鐘・不記名。臨床業務需要提前離席也請填寫，您的回饋同樣重要。</p>
                            <p className="text-xs text-[#B0B3B2]">場次：{meetingId}</p>
                        </div>

                        {status === 'error' && (
                            <div className="mb-6 p-4 bg-red-50 border border-red-100 rounded-xl text-red-600 text-center">⚠️ {errorMessage}</div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-6">
                            <SectionCard title="基本資料" icon="id" color="text-[#A69C8E]"
                                description={storedProfile ? '已從前測自動帶入，若有誤請修改' : '請填寫您的科部與職級'}>
                                <div className="space-y-2">
                                    <label className="text-sm font-medium text-[#5E6160]">填寫時機</label>
                                    <div className="flex flex-wrap gap-2">{TIMING.map(t => <Chip key={t} active={timing === t} onClick={() => setTiming(t)}>{t}</Chip>)}</div>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-sm font-medium text-[#5E6160]">科部</label>
                                    <select value={dept} onChange={e => setDept(e.target.value)} className="w-full p-3 rounded-xl bg-[#FAFAF9] border border-[#DCD9D1] outline-none focus:border-[#7B8D8E] text-[#5E6160]">
                                        <option value="">請選擇</option>
                                        {DEPARTMENTS.map(d => <option key={d}>{d}</option>)}
                                        <option>其他</option>
                                    </select>
                                    {dept === '其他' && <input value={deptOther} onChange={e => setDeptOther(e.target.value)} placeholder="請填寫科部名稱" className="w-full p-3 rounded-xl bg-[#FAFAF9] border border-[#DCD9D1] outline-none focus:border-[#7B8D8E]" />}
                                </div>
                                <div className="space-y-2">
                                    <label className="text-sm font-medium text-[#5E6160]">職級</label>
                                    <div className="flex flex-wrap gap-2">
                                        {RANKS.map(r => <Chip key={r} active={rank === r} onClick={() => setRank(r)}>{r}</Chip>)}
                                        <Chip active={rank === '其他'} onClick={() => setRank('其他')}>其他</Chip>
                                    </div>
                                    {rank === '其他' && <input value={rankOther} onChange={e => setRankOther(e.target.value)} placeholder="請填寫職級" className="w-full p-3 rounded-xl bg-[#FAFAF9] border border-[#DCD9D1] outline-none focus:border-[#7B8D8E]" />}
                                </div>
                                {!storedCode && (
                                    <div className="space-y-2">
                                        <label className="text-sm font-medium text-[#5E6160]">前測配對碼（選填）</label>
                                        <input value={manualCode} onChange={e => setManualCode(e.target.value)} maxLength={6} placeholder="前測完成頁面顯示的 6 碼；沒有可留空"
                                            className="w-full p-3 rounded-xl bg-[#FAFAF9] border border-[#DCD9D1] outline-none focus:border-[#7B8D8E] uppercase tracking-widest" />
                                    </div>
                                )}
                            </SectionCard>

                            {SECTIONS.map((sec, si) => (
                                <SectionCard key={si} title={sec.title} icon={sec.icon} color={sec.color} description={`${sec.desc}（1＝非常不同意，5＝非常同意）`}>
                                    {sec.items.map(([id, q]) => (
                                        <LikertQuestion key={id} no={LIKERT_KEYS.indexOf(id) + 1} id={id} question={q} value={scores[id]}
                                            missing={showMissing && !scores[id]}
                                            onChange={(k, v) => { setScores(p => ({ ...p, [k]: v })); if (status === 'error') setStatus('idle'); }} />
                                    ))}
                                </SectionCard>
                            ))}

                            <SectionCard title="三、建議（選填）" icon="msg" color="text-[#A69C8E]">
                                <div className="space-y-3">
                                    <label htmlFor="suggestion" className="block text-base md:text-lg font-medium text-[#5E6160]">11. 您最希望院方優先改善的一件事是什麼？</label>
                                    <textarea id="suggestion" value={suggestion} onChange={e => setSuggestion(e.target.value)} placeholder="例如：排班制度、臨床教學時間、資訊系統…"
                                        className="w-full min-h-[110px] p-4 rounded-xl bg-[#FAFAF9] border border-[#DCD9D1] focus:border-[#7B8D8E] outline-none text-[#5E6160] resize-y" />
                                </div>
                            </SectionCard>

                            <button type="submit" disabled={status === 'submitting'}
                                className="w-full bg-[#7B8D8E] text-white py-4 px-6 rounded-xl font-bold text-lg hover:bg-[#5E6160] transition-all shadow-md disabled:opacity-70 flex items-center justify-center gap-2">
                                {status === 'submitting' ? <><Icon d={ICON.loader} className="w-5 h-5 animate-spin" /> 處理中...</> : <>確認送出回饋 <Icon d={ICON.send} className="w-5 h-5" /></>}
                            </button>
                        </form>
                        <footer className="mt-12 text-center text-sm pb-8 font-bold text-[#5E6160]">教學部 住院醫師組</footer>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<PostEventSurvey />);
    </script>
</body>
</html>
